<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camp ID</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    width:360px;
    margin:40px auto;
    background:#222;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    color:#d4af37;
    font-size:30px;
    margin-bottom:20px;
}

#photo{
    width:170px;
    height:170px;
    border-radius:20px;
    object-fit:cover;
    display:none;
    margin:0 auto 20px auto;
    border:4px solid #d4af37;
}

#number{
    font-size:36px;
    color:#d4af37;
    font-weight:bold;
    margin-bottom:15px;
}

#name{
    font-size:30px;
    font-weight:bold;
    margin-bottom:15px;
}

#job{
    font-size:22px;
    color:#d4af37;
    margin-bottom:10px;
}

#info{
    font-size:22px;
    margin-bottom:30px;
}

button{
    width:220px;
    height:60px;
    border:none;
    border-radius:15px;
    background:#d4af37;
    color:black;
    font-size:24px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

</style>

</head>

<body>

<div class="card">

<h1>🛡 MC SPECIAL FORCES</h1>

<img id="photo" src="" alt="Fotografie operátora">

<div id="number"></div>

<div id="name"></div>

<div id="job"></div>

<div id="info"></div>

<button onclick="window.location.href='scanner.html'">
DALŠÍ SKEN
</button>

</div>

<script>

const op = JSON.parse(sessionStorage.getItem("operator"));

if(!op){

    document.body.innerHTML =
    "<h2 style='margin-top:120px;text-align:center;color:white;'>Operátor nenalezen.</h2>";

}else{

    document.getElementById("number").textContent = "MC-" + op.number;

    document.getElementById("name").textContent = op.name;

    document.getElementById("job").textContent = op.job;

    if(op.photo && op.photo !== ""){
        const img = document.getElementById("photo");
        img.src = op.photo;
        img.style.display = "block";
    }

    if(op.job === "Instruktor"){
        document.getElementById("info").textContent = "INSTRUKTOR";
    }else{
        document.getElementById("info").textContent = op.age + " let";
    }

}

</script>

</body>
</html>
