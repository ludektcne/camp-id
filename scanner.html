<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="operators.js"></script>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
}

h2{
    color:#d4af37;
    margin-top:20px;
}

#reader{
    width:100%;
    max-width:420px;
    margin:25px auto;
}

</style>

</head>

<body>

<h2>Naskenuj QR kód</h2>

<div id="reader"></div>

<script>

function onScanSuccess(decodedText){

    decodedText = decodedText.trim();

    html5QrCode.stop().then(()=>{

        const op = operators[decodedText];

        if(!op){
            alert("Operátor nenalezen");
            html5QrCode.start(cameraConfig,scannerConfig,onScanSuccess);
            return;
        }

        if(op.type==="crystal"){
            alert("💎 KRYSTAL AKTIVOVÁN");
            html5QrCode.start(cameraConfig,scannerConfig,onScanSuccess);
            return;
        }

        if(op.type==="bivoj"){
            alert("🧸 BIVOJ JE NALEZEN");
            html5QrCode.start(cameraConfig,scannerConfig,onScanSuccess);
            return;
        }

        if(op.type==="message"){
            alert("📜 ZPRÁVA OD BIVOJE");
            html5QrCode.start(cameraConfig,scannerConfig,onScanSuccess);
            return;
        }

        sessionStorage.setItem("operator",JSON.stringify(op));

        window.location.href="card.html";

    });

}

const cameraConfig={
    facingMode:"environment"
};

const scannerConfig={
    fps:20,
    qrbox:{
        width:300,
        height:300
    },
    aspectRatio:1.0,
    rememberLastUsedCamera:true
};

const html5QrCode=new Html5Qrcode("reader");

html5QrCode
.start(
    cameraConfig,
    scannerConfig,
    onScanSuccess
)
.catch(err=>{
    alert("Nepodařilo se spustit kameru.");
    console.error(err);
});

</script>

</body>
</html>
